# Currency Rates → production (CONTABO VPS, behind the shared nginx proxy).
#
# Three containers on the `meshcaster` network, none with a host port; nginx reaches them by name
# (deploy/nginx/currency-rates.conf):
#
#   currency-rates-api     image currency-rates      APP_ROLE=api     migrates, then serves :8000
#   currency-rates-worker  image currency-rates      APP_ROLE=worker  background jobs + seed
#   currency-rates-web     image currency-rates-web                   public app :8080, admin :8081 (tunnel only)
#
# The worker deploys after the API, so it never starts against a schema the API has not migrated
# yet. Both read /opt/meshcaster/currency-rates.env, written once by deploy/bootstrap-env.sh.
# First deploy: see deploy/README.md.
name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the back end
        run: uv sync --locked --extra postgres

      # Catches a broken import or wiring before an image is built.
      - name: Import the API and the worker
        run: uv run python -c "import host.app, host.worker; host.app.create_app()"
        env:
          APP_ENV: development

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/*/package-lock.json

      - name: Build the public app
        working-directory: web/app
        run: npm ci && npm run build

      - name: Build the admin app
        working-directory: web/admin
        run: npm ci && npm run build

  api:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: MeshCaster/DevOps/.github/workflows/deploy-container.yml@main
    with:
      image-name: currency-rates
      container-name: currency-rates-api
      container-port: 8000
      aspnetcore: false
      extra-env: "-e APP_ROLE=api"
      env-file: /opt/meshcaster/currency-rates.env
      network: meshcaster
    secrets:
      host: ${{ secrets.CONTABO_HOST }}
      username: ${{ secrets.CONTABO_USERNAME }}
      ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}

  worker:
    needs: api
    permissions:
      contents: read
      packages: write
    uses: MeshCaster/DevOps/.github/workflows/deploy-container.yml@main
    with:
      image-name: currency-rates
      container-name: currency-rates-worker
      container-port: 8000
      aspnetcore: false
      extra-env: "-e APP_ROLE=worker"
      env-file: /opt/meshcaster/currency-rates.env
      network: meshcaster
    secrets:
      host: ${{ secrets.CONTABO_HOST }}
      username: ${{ secrets.CONTABO_USERNAME }}
      ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}

  # After the worker, not alongside the API: each deploy ends with `docker image prune`, and a
  # prune while another job's image is still unpacking deletes layers mid-extraction.
  web:
    needs: worker
    permissions:
      contents: read
      packages: write
    uses: MeshCaster/DevOps/.github/workflows/deploy-container.yml@main
    with:
      image-name: currency-rates-web
      container-name: currency-rates-web
      dockerfile: docker/web/Dockerfile
      container-port: 8080
      aspnetcore: false
      network: meshcaster
    secrets:
      host: ${{ secrets.CONTABO_HOST }}
      username: ${{ secrets.CONTABO_USERNAME }}
      ssh-private-key: ${{ secrets.CONTABO_SSH_PRIVATE_KEY }}
