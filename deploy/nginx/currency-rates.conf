# Currency Rates (production) — vhost for the shared nginx proxy (MeshCaster/DevOps tools/nginx).
#
#   currency-rates.in-vent.online   /      -> currency-rates-web:8080  (public app)
#                                   /api/  -> currency-rates-api:8000
#
# The admin app has no vhost here: it is reached only through the Cloudflare tunnel, with
# Cloudflare Access in front (deploy/README.md). The public app shares its hostname with the API,
# so the browser never makes a cross-origin call and the API needs no CORS settings. None of the containers publishes a host port; nginx reaches
# them by name over the `meshcaster` network.
#
# Upstreams are resolved per request through Docker's DNS (127.0.0.11), via variables. A literal
# `proxy_pass http://currency-rates-api:8000` is resolved when nginx loads its config, so while a
# container is missing — before its first deploy, or mid-redeploy — `nginx -t` fails and the
# WHOLE proxy refuses to reload. With variables, a missing container is a 502 on this host only.
#
#   tools/nginx/remote-setup.sh -i ~/.ssh/meshcaster_contabo_vps_1 root@169.58.27.99 \
#     --skip-init --email <acme-email> \
#     --cert "currency-rates.in-vent.online" \
#     --conf <path to this file>

# ---------- HTTP :80 — ACME challenge + redirect to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name currency-rates.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- HTTPS :443 — public app + API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name currency-rates.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/currency-rates.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/currency-rates.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/currency-rates.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # The API only takes small JSON bodies.
    client_max_body_size 1M;

    access_log /var/log/nginx/currency-rates.access.log main;
    error_log  /var/log/nginx/currency-rates.error.log warn;

    # The Docker resolver is set per location: ssl-params.conf already sets a public resolver at
    # this level for OCSP stapling, and a second one here is rejected as a duplicate.
    set $currency_rates_api http://currency-rates-api:8000;
    set $currency_rates_web http://currency-rates-web:8080;

    location /api/ {
        proxy_pass $currency_rates_api;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        proxy_pass $currency_rates_web;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
