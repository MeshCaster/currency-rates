# Static server inside the currency-rates-web container. TLS and /api/ routing belong to the
# host's nginx (deploy/nginx/currency-rates.conf); this only serves the built files.

# ---------- :8080 — public app (web/app)
server {
    listen 8080;
    root /usr/share/nginx/html/app;

    # Vite's content-hashed bundles, safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers on the old bundle names.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ---------- :8081 — admin app (web/admin)
#
# Reached only through the Cloudflare tunnel (Cloudflare Access in front), never through the host's
# nginx, so this server also routes /api/ to the API itself to keep the app same-origin.
server {
    listen 8081;
    root /usr/share/nginx/html/admin;

    # The API container, resolved per request through Docker's DNS: a literal upstream would be
    # resolved at startup and keep this container from starting while the API is missing.
    set $currency_rates_api http://currency-rates-api:8000;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass $currency_rates_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 1M;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
