[project]
name = "fastapi-template"
version = "0.1.0"
description = "Production-ready FastAPI template with environment profiles"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "poethepoet>=0.29",
    "httpx2>=2.16.0",
]

[tool.poe.tasks.dev]
help = "Development: hot reload, text logs, docs on"
cmd = "uvicorn host.app:create_app --factory --app-dir src --reload --host 127.0.0.1 --port 8000 --no-access-log"
env = { APP_ENV = "development" }

[tool.poe.tasks.staging]
help = "Staging config locally: JSON logs, no reload"
cmd = "uvicorn host.app:create_app --factory --app-dir src --host 127.0.0.1 --port 8000 --no-access-log"
env = { APP_ENV = "staging" }

[tool.poe.tasks.prod-local]
help = "Production config locally, multiple workers"
cmd = "uvicorn host.app:create_app --factory --app-dir src --host 127.0.0.1 --port 8000 --workers 4 --no-access-log --proxy-headers"
env = { APP_ENV = "production" }

[tool.poe.tasks.worker]
help = "Background jobs (rate sync) in their own process; run next to `dev`"
cmd = "python -m host.worker"
env = { APP_ENV = "development", PYTHONPATH = "src" }

[tool.poe.tasks.seed]
help = "Seed the provider catalog, plus dev sync configurations (idempotent)"
cmd = "python -m host.seed"
env = { APP_ENV = "development", PYTHONPATH = "src" }

[tool.poe.tasks.test]
cmd = "pytest"
env = { APP_ENV = "test" }

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src"
check = ["lint", "typecheck", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:(core|host|application|domain|infrastructure)\\..*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "PL", "TC"]
ignore = [
    "PLR0913", "PLR2004", "S104", "TC001", "TC002", "TC003",
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/application",
    "src/core",
    "src/domain",
    "src/host",
    "src/infrastructure",
    "src/rates_provider_integration",
    "src/smtp_integration",
]