server {
    listen 80;
    listen [::]:80;
    server_name currency-rates.in-vent.online currency-rates-admin.in-vent.online;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name currency-rates.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/currency-rates.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/currency-rates.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/currency-rates.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 1M;

    access_log /var/log/nginx/currency-rates.access.log main;
    error_log  /var/log/nginx/currency-rates.error.log warn;

    set $currency_rates_api http://currency-rates-api:8000;
    set $currency_rates_web http://currency-rates-web:8080;

    location /api/ {
        proxy_pass $currency_rates_api;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        proxy_pass $currency_rates_web;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name currency-rates-admin.in-vent.online;

    ssl_certificate         /etc/letsencrypt/live/currency-rates-admin.in-vent.online/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/currency-rates-admin.in-vent.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/currency-rates-admin.in-vent.online/chain.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 1M;

    access_log /var/log/nginx/currency-rates-admin.access.log main;
    error_log  /var/log/nginx/currency-rates-admin.error.log warn;

    set $currency_rates_api   http://currency-rates-api:8000;
    set $currency_rates_admin http://currency-rates-web:8081;

    location /api/ {
        proxy_pass $currency_rates_api;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location / {
        proxy_pass $currency_rates_admin;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}
